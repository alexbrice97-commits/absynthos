name: build-absynth-os
on:
  schedule:
    - cron: "00 06 * * *"   # daily rebuild picks up Fedora + FOURTHNODE security fixes
  push:
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
jobs:
  bluebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
